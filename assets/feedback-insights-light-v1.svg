<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Personalised interview assistance insights illustration</title>
  <desc id="desc">A light dashboard visual showing clarity, structure, and personal communication insights.</desc>
  <defs>
    <linearGradient id="background" x1="25" y1="13" x2="982" y2="702" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF5FF"/></linearGradient>
    <linearGradient id="score" x1="83" y1="155" x2="374" y2="449" gradientUnits="userSpaceOnUse"><stop stop-color="#4F46E5"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="720" rx="38" fill="url(#background)"/>
  <circle cx="920" cy="72" r="142" fill="#DBEAFE"/><circle cx="72" cy="674" r="117" fill="#E0E7FF" fill-opacity=".7"/>
  <g filter="url(#shadow)">
    <rect x="64" y="80" width="872" height="559" rx="30" fill="#FFFFFF" stroke="#D4DBE6" stroke-width="2"/>
    <text x="108" y="138" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.9">SESSION INSIGHTS</text>
    <text x="108" y="180" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="780">Your communication insights</text>
    <text x="108" y="211" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Keep your response relevant, clear, and focused.</text>
    <rect x="108" y="251" width="282" height="324" rx="24" fill="url(#score)"/>
    <circle cx="249" cy="372" r="91" fill="#FFFFFF" fill-opacity=".17"/><circle cx="249" cy="372" r="70" fill="none" stroke="#DBEAFE" stroke-opacity=".35" stroke-width="12"/><path d="M249 302a70 70 0 0 1 65 96" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <text x="208" y="383" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800">82</text><text x="257" y="383" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">/100</text>
    <text x="179" y="446" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">Confidence score</text>
    <rect x="144" y="492" width="210" height="46" rx="13" fill="#FFFFFF" fill-opacity=".16"/><path d="m169 513 7 7 14-17" fill="none" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="201" y="520" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Strong improvement</text>
    <rect x="428" y="251" width="462" height="139" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="456" y="288" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">What went well</text>
    <path d="m457 329 8 8 16-20" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="335" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">You used a clear, specific example.</text>
    <path d="m457 363 8 8 16-20" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="369" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Your answer stayed focused and concise.</text>
    <rect x="428" y="410" width="462" height="165" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="456" y="448" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">Try this next time</text>
    <circle cx="470" cy="487" r="13" fill="#DBEAFE"/><text x="466" y="492" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">1</text><text x="496" y="492" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">End with the measurable result.</text>
    <circle cx="470" cy="528" r="13" fill="#E0E7FF"/><text x="466" y="533" fill="#4F46E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">2</text><text x="496" y="533" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Pause before your key takeaway.</text>
  </g>
