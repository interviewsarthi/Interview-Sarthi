<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI interview assistance illustration</title>
  <desc id="desc">An illustration of a candidate using AI interview assistance to organise a clear response framework.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="1160" y2="735" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF5FF"/></linearGradient>
    <linearGradient id="ai" x1="756" y1="179" x2="1065" y2="522" gradientUnits="userSpaceOnUse"><stop stop-color="#4F46E5"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0F172A" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#background)"/>
  <circle cx="1048" cy="112" r="177" fill="#DBEAFE"/><circle cx="103" cy="683" r="163" fill="#E0E7FF" fill-opacity=".65"/>
  <g filter="url(#shadow)">
    <rect x="67" y="119" width="625" height="502" rx="30" fill="#FFFFFF" stroke="#D4DBE6" stroke-width="2"/>
    <path d="M67 149c0-16.57 13.43-30 30-30h565c16.57 0 30 13.43 30 30v51H67v-51Z" fill="#F8FAFC"/>
    <path d="M67 200h625" stroke="#E6EAF1" stroke-width="2"/>
    <circle cx="110" cy="160" r="8" fill="#FB7185"/><circle cx="135" cy="160" r="8" fill="#FBBF24"/><circle cx="160" cy="160" r="8" fill="#34D399"/>
    <rect x="201" y="143" width="187" height="34" rx="17" fill="#EFF6FF"/><circle cx="225" cy="160" r="5" fill="#059669"/><text x="240" y="166" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">INTERVIEW ASSISTANT</text>
    <rect x="103" y="237" width="255" height="334" rx="22" fill="#EAF2FF"/>
    <rect x="126" y="258" width="209" height="43" rx="13" fill="#FFFFFF" fill-opacity=".75"/><text x="146" y="285" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">YOUR RESPONSE</text>
    <ellipse cx="231" cy="490" rx="78" ry="32" fill="#C7D2FE" fill-opacity=".65"/>
    <path d="M186 447c0-35 20-61 45-61s45 26 45 61v51h-90v-51Z" fill="#2563EB"/>
    <circle cx="231" cy="355" r="49" fill="#F2C8AD"/><path d="M187 348c0-44 23-67 48-67 27 0 47 21 47 57-10-9-23-16-43-16-22 0-39 11-52 26Z" fill="#1E293B"/>
    <path d="M213 360c5 3 11 3 16 0M244 360c5 3 11 3 16 0" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/><path d="M225 383c7 5 17 5 24 0" fill="none" stroke="#A85555" stroke-width="3" stroke-linecap="round"/>
    <rect x="138" y="518" width="186" height="25" rx="12.5" fill="#FFFFFF" fill-opacity=".74"/><rect x="158" y="528" width="102" height="6" rx="3" fill="#93C5FD"/>
    <text x="390" y="265" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.6">QUESTION</text>
    <text x="390" y="305" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">Tell me about a time you</text><text x="390" y="336" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">solved a difficult problem.</text>
    <rect x="390" y="369" width="260" height="153" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="414" y="402" fill="#4F46E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">TRY THE STAR FRAMEWORK</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700"><rect x="414" y="423" width="49" height="30" rx="9" fill="#DBEAFE"/><text x="424" y="443" fill="#1D4ED8">S</text><rect x="473" y="423" width="49" height="30" rx="9" fill="#E0E7FF"/><text x="483" y="443" fill="#4F46E5">T</text><rect x="532" y="423" width="49" height="30" rx="9" fill="#E0F2FE"/><text x="542" y="443" fill="#0284C7">A</text><rect x="591" y="423" width="35" height="30" rx="9" fill="#D1FAE5"/><text x="600" y="443" fill="#059669">R</text></g>
    <text x="414" y="484" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Use a real example. Be specific.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="743" y="176" width="373" height="402" rx="32" fill="url(#ai)"/>
    <rect x="776" y="208" width="307" height="46" rx="15" fill="#FFFFFF" fill-opacity=".16"/><path d="m808 218 5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12Z" fill="#FEF3C7"/><text x="842" y="240" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">AI INTERVIEW ASSISTANT</text>
    <circle cx="929" cy="345" r="83" fill="#FFFFFF" fill-opacity=".12"/><path d="M880 351c23 0 39-10 51-28 13-19 22-45 43-45 15 0 29 10 43 27" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/><circle cx="880" cy="351" r="10" fill="#A5F3FC"/>
    <path d="m1004 272 5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12Z" fill="#FDE68A"/>
    <text x="793" y="473" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">Stay clear and relevant.</text><text x="793" y="505" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Organise the points that matter</text><text x="793" y="529" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">from your own experience.</text>
  </g>
  <path d="M696 336c30-15 38-29 47-47" fill="none" stroke="#818CF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 13"/>
  <circle cx="713" cy="328" r="8" fill="#818CF8"/>
  <text x="600" y="692" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.8">CLEAR SUPPORT. YOUR EXPERIENCE.</text>
</svg>
